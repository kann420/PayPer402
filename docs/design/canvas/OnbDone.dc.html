<style>
body{margin:0;background:#F4F5F1}
@keyframes pg-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pg-card{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pg-check{0%{transform:scale(0) rotate(-25deg)}65%{transform:scale(1.15) rotate(4deg)}100%{transform:none}}
@keyframes pg-ring{0%{box-shadow:0 0 0 0 rgba(43,227,138,.6)}100%{box-shadow:0 0 0 22px rgba(43,227,138,0)}}
main > section{animation:pg-card .7s cubic-bezier(.2,.8,.2,1) backwards}
main > section > span:first-child{animation:pg-check .7s .35s cubic-bezier(.3,1.5,.5,1) backwards,pg-ring 1s 1s ease-out}
main > section > *:nth-child(2){animation:pg-in .6s .5s cubic-bezier(.2,.8,.2,1) backwards}main > section > *:nth-child(3){animation:pg-in .6s .62s cubic-bezier(.2,.8,.2,1) backwards}main > section > *:nth-child(4){animation:pg-in .6s .74s cubic-bezier(.2,.8,.2,1) backwards}
@media (prefers-reduced-motion: reduce){main *,main > *{animation:none !important}}
a{color:#087A3D;text-decoration:none}a:hover{color:#05592C}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
